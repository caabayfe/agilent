# Customer Facing Assistant PoC. Only the UI (5173), the BFF (8000) and the Jaeger
# UI (16686) are published, and only on localhost; everything else lives on the
# private network.
name: cfa

x-app: &app
  build: {context: ., target: runtime}
  image: cfa-app:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on: &after-migrate
    migrate: {condition: service_completed_successfully}

# OpenTelemetry: every Python service exports spans (OTLP/HTTP) to Jaeger.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-skill-env: &skill-env
  IDP_URL: http://idp:8000
  IDP_ISSUER: http://idp:8000
  ALLOW_EVAL_MUTANTS: ${ALLOW_EVAL_MUTANTS:-false}
  <<: *otel

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cfa
      POSTGRES_USER: cfa_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfa_admin -d cfa"]
      interval: 3s
      retries: 20

  # One-shot job: Alembic migrations + LangGraph checkpointer setup, as the DB owner.
  # Every service waits for it; none of them has DDL rights.
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "cfa.migrate"]
    healthcheck: {disable: true}
    environment:
      MIGRATE_DATABASE_URL: postgresql://cfa_admin:${POSTGRES_PASSWORD}@postgres:5432/cfa
      DB_PASSWORD_ORDERS: ${DB_PASSWORD_ORDERS:?run make init}
      DB_PASSWORD_BILLING: ${DB_PASSWORD_BILLING:?run make init}
      DB_PASSWORD_SERVICE: ${DB_PASSWORD_SERVICE:?run make init}
      DB_PASSWORD_PLATFORM: ${DB_PASSWORD_PLATFORM:?run make init}
      DB_PASSWORD_EVAL: ${DB_PASSWORD_EVAL:?run make init}
    depends_on: {postgres: {condition: service_healthy}}

  # Trace backend (OTLP in, UI on localhost:16686). Production: Azure Monitor / App Insights.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["127.0.0.1:16686:16686"]

  idp:
    <<: *app
    command: ["uvicorn", "cfa.identity.idp:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://cfa_platform:${DB_PASSWORD_PLATFORM}@postgres:5432/cfa
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:?run make init}
      OTEL_SERVICE_NAME: cfa-idp
      <<: *otel

  # ONE MCP server for the customer-data bounded context, hosting three skills.
  # Each skill still logs in to Postgres as its own least-privilege role.
  mcp-customer:
    <<: *app
    command: ["uvicorn", "cfa.skills.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *skill-env
      DATABASE_URL_ORDERS: postgresql://cfa_orders:${DB_PASSWORD_ORDERS}@postgres:5432/cfa
      DATABASE_URL_BILLING: postgresql://cfa_billing:${DB_PASSWORD_BILLING}@postgres:5432/cfa
      DATABASE_URL_SERVICE: postgresql://cfa_service:${DB_PASSWORD_SERVICE}@postgres:5432/cfa
      DISABLED_SKILLS: ${DISABLED_SKILLS:-}  # kill switch: make disable-skill SKILL=billing
      OTEL_SERVICE_NAME: cfa-mcp-customer
    depends_on: {<<: *after-migrate, idp: {condition: service_healthy}}

  fake-llm:
    <<: *app
    command: ["uvicorn", "cfa.fake_llm.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FAKE_LLM_API_KEY: ${FAKE_LLM_API_KEY:?run make init}
    depends_on: {}

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    # The gateway admin supervises litellm and serves the UI model selector's
    # internal API on :4001 (compose network only, master-key auth).
    entrypoint: ["python3", "/opt/cfa/gateway_admin.py"]
    command: ["--", "litellm", "--config", "/app/gateway/active.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run make init}
      FAKE_LLM_API_KEY: ${FAKE_LLM_API_KEY}
      MODEL_FAST_LITELLM_MODEL: ${MODEL_FAST_LITELLM_MODEL:-}
      MODEL_FAST_API_BASE: ${MODEL_FAST_API_BASE:-}
      MODEL_FAST_API_KEY: ${MODEL_FAST_API_KEY:-}
      MODEL_FAST_API_VERSION: ${MODEL_FAST_API_VERSION:-}
      MODEL_REASONING_LITELLM_MODEL: ${MODEL_REASONING_LITELLM_MODEL:-}
      MODEL_REASONING_API_BASE: ${MODEL_REASONING_API_BASE:-}
      MODEL_REASONING_API_KEY: ${MODEL_REASONING_API_KEY:-}
      MODEL_REASONING_API_VERSION: ${MODEL_REASONING_API_VERSION:-}
      MODEL_ALT_LITELLM_MODEL: ${MODEL_ALT_LITELLM_MODEL:-}
      MODEL_ALT_API_BASE: ${MODEL_ALT_API_BASE:-}
      MODEL_ALT_API_KEY: ${MODEL_ALT_API_KEY:-}
      MODEL_ALT_API_VERSION: ${MODEL_ALT_API_VERSION:-}
    volumes:
      # Writable: the gateway admin rewrites active.yaml / active.profile.
      - ./gateway:/app/gateway
      - ./src/cfa/gateway_admin.py:/opt/cfa/gateway_admin.py:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)\""]
      interval: 5s
      retries: 30
    depends_on: [fake-llm]

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql://cfa_platform:${DB_PASSWORD_PLATFORM}@postgres:5432/cfa
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET}
      GATEWAY_URL: http://litellm:4000/v1
      GATEWAY_API_KEY: ${LITELLM_MASTER_KEY}
      GATEWAY_ADMIN_URL: http://litellm:4001
      # Local demo only: lets a signed-in UI user re-point the model aliases.
      GATEWAY_ADMIN_ENABLED: ${GATEWAY_ADMIN_ENABLED:-true}
      OTEL_SERVICE_NAME: cfa-bff
      <<: *otel
    volumes:
      - ./gateway:/app/gateway:ro
      - ./evals/reports:/app/evals/reports:ro
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      <<: *after-migrate
      idp: {condition: service_healthy}
      mcp-customer: {condition: service_healthy}
      litellm: {condition: service_healthy}

  # On-demand eval harness: `make eval`. Its own DB role (cfa_eval) reads ground truth.
  evals:
    <<: *app
    restart: "no"
    profiles: [tools]
    command: ["python", "-m", "evals.run"]
    environment:
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET}
      GATEWAY_URL: http://litellm:4000/v1
      GATEWAY_API_KEY: ${LITELLM_MASTER_KEY}
      EVAL_DATABASE_URL: postgresql://cfa_eval:${DB_PASSWORD_EVAL}@postgres:5432/cfa
      GATEWAY_ADMIN_URL: http://litellm:4001   # evals.matrix switches models between runs
      OTEL_SERVICE_NAME: cfa-evals
      <<: *otel
    volumes:
      - ./gateway:/app/gateway:ro
      - ./evals/reports:/app/evals/reports
    depends_on: {api: {condition: service_healthy}}

  ui:
    build: {context: ./ui}
    image: cfa-ui:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:5173:8080"]
    depends_on: {api: {condition: service_healthy}}

volumes:
  pgdata:
