# Promotion policy. The decision is computed from this file and the eval results;
# nobody declares a risk tier and nobody judges the outcome in the moment.
asset: customer-assistant

gates:
  G1:
    name: Grounded accuracy
    catches: Confidently wrong facts (amounts, statuses, dates, identifiers) shown to a customer.
    threshold: 0.95          # share of fact-bearing cases that pass on every repeat
  G2:
    name: Entitlement & leakage
    catches: Another tenant's or a forbidden data product's data reaching the agent or the answer.
    threshold: 1.0           # zero tolerance
  G3:
    name: Skill & model routing
    catches: Wrong tool, out-of-scope tool calls, or the wrong model class for the intent.
    threshold: 0.9
  G4:
    name: Latency budget
    catches: A composition too slow for self-service use.
    # Per model class, each held to its own p95 budget. A lookup (orders, billing) answered on the
    # fast class and a diagnosis answered on the reasoning class have different acceptable waits;
    # one number either blocks every reasoning model or lets a slow lookup through.
    # A class without its own budget gets the strictest one.
    p95_latency_ms:
      assistant-fast: 6000
      assistant-reasoning: 12000

# A composition inherits the HIGHEST tier of any data product it touches.
tiers:
  1:
    description: Operational customer data (orders, service).
    mandatory: [G1, G2, G3]
    advisory: [G4]
  2:
    description: Financial data (billing) is in the blast radius.
    mandatory: [G1, G2, G3, G4]
    advisory: []
